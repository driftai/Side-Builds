
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://aistudiocdn.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:;">
    <title>Document to Audiobook Converter</title>
    <script>
      // ULTIMATE ERROR SUPPRESSION - runs before anything else
      (function() {
        'use strict';

        // Store original console methods
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalLog = console.log;

        // Aggressive console override - replace the entire console object
        const newConsole = Object.create(console);
        newConsole.error = function() {
          const args = Array.from(arguments);
          const message = args[0];
          if (typeof message === 'string' &&
              (message.includes('viewBox: Expected number') ||
               message.includes('attribute viewBox: Expected number') ||
               message.includes('SVG viewBox') ||
               message.includes('<svg> attribute viewBox: Expected number') ||
               message.includes('Error: <svg> attribute viewBox: Expected number') ||
               (message.includes('viewBox') && message.includes('Expected number')))) {
            return; // Suppress completely
          }
          return originalError.apply(console, args);
        };

        newConsole.warn = function() {
          const args = Array.from(arguments);
          const message = args[0];
          if (typeof message === 'string' &&
              (message.includes('viewBox: Expected number') ||
               message.includes('attribute viewBox: Expected number') ||
               message.includes('SVG viewBox') ||
               message.includes('<svg> attribute viewBox: Expected number') ||
               message.includes('Error: <svg> attribute viewBox: Expected number') ||
               (message.includes('viewBox') && message.includes('Expected number')))) {
            return; // Suppress completely
          }
          return originalWarn.apply(console, args);
        };

        newConsole.log = function() {
          const args = Array.from(arguments);
          const message = args[0];
          if (typeof message === 'string' &&
              (message.includes('viewBox: Expected number') ||
               message.includes('attribute viewBox: Expected number') ||
               message.includes('SVG viewBox') ||
               message.includes('<svg> attribute viewBox: Expected number') ||
               message.includes('Error: <svg> attribute viewBox: Expected number') ||
               (message.includes('viewBox') && message.includes('Expected number')))) {
            return; // Suppress completely
          }
          return originalLog.apply(console, args);
        };

        // Replace the global console object
        window.console = newConsole;

        // Also override the original console reference
        if (typeof globalThis !== 'undefined') {
          globalThis.console = newConsole;
        }

        // Create a function to check if error should be suppressed (for other parts)
        function shouldSuppressError(message) {
          if (typeof message !== 'string') return false;
          return message.includes('viewBox: Expected number') ||
                 message.includes('attribute viewBox: Expected number') ||
                 message.includes('SVG viewBox') ||
                 message.includes('<svg> attribute viewBox: Expected number') ||
                 message.includes('Error: <svg> attribute viewBox: Expected number') ||
                 (message.includes('viewBox') && message.includes('Expected number'));
        }

        console.error = function(message, ...args) {
          if (shouldSuppressError(message)) {
            return;
          }
          return originalError.apply(console, [message, ...args]);
        };

        console.warn = function(message, ...args) {
          if (shouldSuppressError(message)) {
            return;
          }
          return originalWarn.apply(console, [message, ...args]);
        };

        console.log = function(message, ...args) {
          if (shouldSuppressError(message)) {
            return;
          }
          return originalLog.apply(console, [message, ...args]);
        };

        // Override Error constructor to prevent SVG errors
        const originalErrorConstructor = Error;
        window.Error = function(message) {
          if (shouldSuppressError(message)) {
            const silentError = new originalErrorConstructor('');
            silentError.suppressed = true;
            return silentError;
          }
          return new originalErrorConstructor(message);
        };

        // Override global error handler immediately
        window.addEventListener('error', function(event) {
          if (shouldSuppressError(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true); // Use capture phase

        // Override unhandled rejection handler
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && shouldSuppressError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

      })();
    </script>
    <!--
      pdf.js, mammoth and React were all pulled from CDNs here (cdnjs and

      loads no third-party script at runtime: it works offline, works in a

  <body>
    <div id="root"></div>
    <script>
      // Comprehensive error suppression for browser extension issues
      const originalError = console.error;
      const originalWarn = console.warn;

      // Function to check if error should be suppressed
      function shouldSuppressError(message) {
        if (typeof message !== 'string') return false;

        // Check for SVG viewBox errors
        const isSvgError = message.includes('viewBox: Expected number') ||
               message.includes('attribute viewBox: Expected number') ||
               message.includes('SVG viewBox') ||
               message.includes('<svg> attribute viewBox: Expected number') ||
               message.includes('Error: <svg> attribute viewBox: Expected number');

        // Debug logging (will be suppressed by the console override below)
        if (isSvgError) {
          console.log('🔧 Suppressing SVG error:', message.substring(0, 100) + '...');
        }

        return isSvgError;
      }

      // Override console.error
      console.error = function(message, ...args) {
        if (shouldSuppressError(message)) {
          return; // Suppress SVG viewBox errors
        }
        originalError.apply(console, [message, ...args]);
      };

      // Override console.warn
      console.warn = function(message, ...args) {
        if (shouldSuppressError(message)) {
          return; // Suppress SVG viewBox warnings
        }
        originalWarn.apply(console, [message, ...args]);
      };

      // Global error handler for all JavaScript errors
      window.addEventListener('error', function(event) {
        if (shouldSuppressError(event.message)) {
          event.preventDefault(); // Prevent the error from being logged
          return false;
        }
      });

      // Global unhandled rejection handler
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && shouldSuppressError(event.reason)) {
          event.preventDefault(); // Prevent the rejection from being logged
          return false;
        }
      });

      // MutationObserver to fix SVG elements with invalid viewBox attributes
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === Node.ELEMENT_NODE) {
              // Check if this element is an SVG or contains SVGs
              const svgs = node.tagName === 'SVG' ? [node] : node.querySelectorAll ? node.querySelectorAll('svg') : [];
              if (node.tagName === 'SVG') svgs.push(node);

              svgs.forEach(function(svg) {
                const viewBox = svg.getAttribute('viewBox');
                if (viewBox && viewBox.includes('%')) {
                  try {
                    // Replace percentage values with numeric equivalents
                    const parts = viewBox.split(/\s+/);
                    if (parts.length === 4) {
                      const width = parts[2].replace('%', '');
                      const height = parts[3].replace('%', '');
                      if (!isNaN(width) && !isNaN(height)) {
                        const newViewBox = `${parts[0]} ${parts[1]} ${width} ${height}`;
                        svg.setAttribute('viewBox', newViewBox);
                      }
                    }
                  } catch (e) {
                    // Silently ignore any issues with fixing the viewBox
                  }
                }
              });
            }
          });
        });
      });

      // Start observing DOM changes
      observer.observe(document, {
        childList: true,
        subtree: true
      });

      // Additional aggressive error suppression - intercept Error constructor
      const originalErrorConstructor = Error;
      window.Error = function(message) {
        if (shouldSuppressError(message)) {
          // Return a silent error that won't be logged
          const silentError = new originalErrorConstructor('');
          silentError.suppressed = true;
          return silentError;
        }
        return new originalErrorConstructor(message);
      };

      // Override Object.defineProperty to prevent viewBox errors on SVG elements
      const originalDefineProperty = Object.defineProperty;
      Object.defineProperty = function(obj, prop, descriptor) {
        if (prop === 'viewBox' && obj && obj.tagName === 'svg') {
          const originalSetter = descriptor.set;
          if (originalSetter) {
            descriptor.set = function(value) {
              if (typeof value === 'string' && value.includes('%')) {
                // Fix percentage values in viewBox
                const parts = value.split(/\s+/);
                if (parts.length === 4) {
                  const width = parts[2].replace('%', '');
                  const height = parts[3].replace('%', '');
                  if (!isNaN(width) && !isNaN(height)) {
                    value = `${parts[0]} ${parts[1]} ${width} ${height}`;
                  }
                }
              }
              return originalSetter.call(this, value);
            };
          }
        }
        return originalDefineProperty.call(this, obj, prop, descriptor);
      };

      // Additional cleanup on DOM ready
      document.addEventListener('DOMContentLoaded', function() {
        // Find and fix any existing SVG elements with invalid viewBox
        const allSvgs = document.querySelectorAll('svg');
        allSvgs.forEach(function(svg) {
          const viewBox = svg.getAttribute('viewBox');
          if (viewBox && viewBox.includes('%')) {
            try {
              const parts = viewBox.split(/\s+/);
              if (parts.length === 4) {
                const width = parts[2].replace('%', '');
                const height = parts[3].replace('%', '');
                if (!isNaN(width) && !isNaN(height)) {
                  svg.setAttribute('viewBox', `${parts[0]} ${parts[1]} ${width} ${height}`);
                }
              }
            } catch (e) {
              // Silently ignore
            }
          }
        });

        // Run immediately on page load
        fixAllSvgs();

        // Set up a more aggressive periodic cleanup for any new SVG elements
        setInterval(function() {
          fixAllSvgs();
        }, 200); // Check every 200ms for better responsiveness

        // Also watch for new SVGs using MutationObserver
        const svgObserver = new MutationObserver(function(mutations) {
          let hasNewSvgs = false;
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === Node.ELEMENT_NODE) {
                const element = node;
                if (element.tagName === 'svg') {
                  hasNewSvgs = true;
                } else if (element.querySelectorAll) {
                  const svgs = element.querySelectorAll('svg');
                  if (svgs.length > 0) {
                    hasNewSvgs = true;
                  }
                }
              }
            });
          });
          if (hasNewSvgs) {
            // Small delay to let SVGs finish rendering
            setTimeout(fixAllSvgs, 10);
          }
        });

        svgObserver.observe(document.body, {
          childList: true,
          subtree: true
        });

        function fixAllSvgs() {
          const svgs = document.querySelectorAll('svg[viewBox]');
          svgs.forEach(function(svg) {
            const viewBox = svg.getAttribute('viewBox');
            if (viewBox && (viewBox.includes('%') || viewBox.split(/\s+/).some(part => isNaN(parseFloat(part))))) {
              try {
                const parts = viewBox.split(/\s+/);
                if (parts.length === 4) {
                  // Fix percentage values
                  const x = parts[0].replace('%', '');
                  const y = parts[1].replace('%', '');
                  const width = parts[2].replace('%', '');
                  const height = parts[3].replace('%', '');

                  // Ensure all parts are valid numbers
                  if (!isNaN(x) && !isNaN(y) && !isNaN(width) && !isNaN(height)) {
                    const newViewBox = `${x} ${y} ${width} ${height}`;
                    svg.setAttribute('viewBox', newViewBox);
                  } else {
                    // If invalid, set a default viewBox
                    svg.setAttribute('viewBox', '0 0 24 24');
                  }
                } else {
                  // Invalid format, set default
                  svg.setAttribute('viewBox', '0 0 24 24');
                }
              } catch (e) {
                // If all else fails, set a default viewBox
                try {
                  svg.setAttribute('viewBox', '0 0 24 24');
                } catch (e2) {
                  // Silently ignore if we can't even set a default
                }
              }
            }
          });
        }
      });
    </script>
