<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audiobook Floating Controls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            color: #f9fafb;
            overflow: hidden;
            user-select: none;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .container {
            width: 320px;
            height: 180px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: move;
            padding: 4px;
            border-radius: 6px;
            -webkit-app-region: drag;
        }

        .header:hover {
            background: rgba(55, 65, 81, 0.5);
        }

        .title {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
        }

        .close-btn:hover {
            color: #f9fafb;
            background: rgba(239, 68, 68, 0.2);
        }

        .progress-container {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%);
            border-radius: 2px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .progress-text {
            font-size: 10px;
            color: #9ca3af;
            text-align: center;
        }


        .sentence-preview {
            flex: 1;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            color: #d1d5db;
            text-align: center;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            border: 1px solid rgba(75, 85, 99, 0.3);
        }

        .status-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-indicator.playing {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .status-indicator.paused {
            background: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
        }

        .status-indicator.stopped {
            background: #6b7280;
            box-shadow: 0 0 8px rgba(107, 114, 128, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" id="header">
            <div class="title">🎵 Audio Controls</div>
            <button class="close-btn" id="close-btn" title="Close">✕</button>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progress-text">0 / 0</div>
        </div>


        <div class="sentence-preview" id="sentence-preview">
            Ready to play
        </div>
    </div>

    <div class="status-indicator" id="status-indicator"></div>

    <script>
        let messagePort = null;

        // Listen for MessageChannel port from main process
        window.addEventListener('message', (event) => {
            if (event.data === 'init-port' && event.ports && event.ports[0]) {
                messagePort = event.ports[0];
                messagePort.start();
                if (window.electronAPI && window.electronAPI.log) window.electronAPI.log('info', 'Controls window: MessageChannel port received');
            }
        });

        // DOM elements
        const closeBtn = document.getElementById('close-btn');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const sentencePreview = document.getElementById('sentence-preview');
        const statusIndicator = document.getElementById('status-indicator');

        let currentState = {
            isPlaying: false,
            currentIndex: -1,
            totalSentences: 0,
            currentSentence: ''
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
        });

        // Set up event listeners
        function setupEventListeners() {
            closeBtn.addEventListener('click', () => {
                if (window.electronAPI && window.electronAPI.log) window.electronAPI.log('info', 'Controls window: Close button clicked');
                if (window.electronAPI && window.electronAPI.closeControls) {
                    window.electronAPI.closeControls();
                } else {
                    if (window.electronAPI && window.electronAPI.log) window.electronAPI.log('error', 'Controls window: electronAPI.closeControls not available');
                }
            });
        }

        // Update UI based on current state
        function updateUI() {
            // Update progress
            const progressPercent = currentState.totalSentences > 0
                ? ((currentState.currentIndex + 1) / currentState.totalSentences) * 100
                : 0;
            progressFill.style.width = `${progressPercent}%`;
            progressText.textContent = `${currentState.currentIndex + 1} / ${currentState.totalSentences}`;

            // Update sentence preview
            sentencePreview.textContent = currentState.currentSentence || 'Ready to play';

            // Update status indicator
            statusIndicator.className = 'status-indicator';
            if (currentState.isPlaying) {
                statusIndicator.classList.add('playing');
            } else if (currentState.currentIndex >= 0) {
                statusIndicator.classList.add('paused');
            } else {
                statusIndicator.classList.add('stopped');
            }
        }
    </script>
</body>
</html>
