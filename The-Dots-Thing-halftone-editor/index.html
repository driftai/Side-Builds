<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halftone Editor</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Halftone Editor</h1>
          <p id="statusText">Load an image or video to begin.</p>
        </div>
        <div class="export-controls">
          <label for="themeMode">Theme</label>
          <select id="themeMode">
            <option value="light" selected>Light</option>
            <option value="dark">Dark</option>
          </select>
          <label for="exportScale">Export</label>
          <select id="exportScale">
            <option value="1">1x PNG</option>
            <option value="2" selected>2x PNG</option>
            <option value="4">4x PNG</option>
          </select>
          <button id="saveButton" class="button button-primary" type="button" disabled>Export PNG</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="Editor controls">
          <section class="panel">
            <label id="uploadDropzone" class="upload-zone" for="fileUpload">
              <span class="upload-title">Choose media</span>
              <span class="upload-copy">Drop or select an image/video file</span>
              <input id="fileUpload" class="sr-only" type="file" accept="image/*,video/*">
            </label>
            <div class="control-row sample-picker">
              <label for="sampleSelect">Sample</label>
              <div class="inline-row">
                <select id="sampleSelect"></select>
                <button id="sampleButton" class="button" type="button">Load</button>
              </div>
            </div>
          </section>

          <section class="panel controls-panel">
            <h2>Presets</h2>
            <div class="control-row">
              <label for="presetSelect">Preset</label>
              <select id="presetSelect"></select>
            </div>
            <div class="preset-actions" aria-label="Preset actions">
              <button id="presetApplyButton" class="button" type="button">Apply</button>
              <button id="presetSaveButton" class="button" type="button">Save changes</button>
              <button id="presetNewButton" class="button" type="button">Save as new</button>
              <button id="presetResetButton" class="button" type="button">Reset preset</button>
            </div>

            <div class="control-row">
              <label for="gridSize">Grid size</label>
              <div class="range-row">
                <input id="gridSize" type="range" min="5" max="50" value="20">
                <output id="gridSizeVal" for="gridSize">20</output>
              </div>
            </div>

            <h2>Image</h2>

            <div class="control-row">
              <label for="brightness">Brightness</label>
              <div class="range-row">
                <input id="brightness" type="range" min="-100" max="100" value="20">
                <output id="brightnessVal" for="brightness">20</output>
              </div>
            </div>

            <div class="control-row">
              <label for="contrast">Contrast</label>
              <div class="range-row">
                <input id="contrast" type="range" min="-100" max="100" value="0">
                <output id="contrastVal" for="contrast">0</output>
              </div>
            </div>

            <div class="control-row">
              <label for="gamma">Gamma</label>
              <div class="range-row">
                <input id="gamma" type="range" min="0.1" max="3" step="0.1" value="1.0">
                <output id="gammaVal" for="gamma">1.0</output>
              </div>
            </div>

            <div class="control-row">
              <label for="smoothing">Smoothing</label>
              <div class="range-row">
                <input id="smoothing" type="range" min="0" max="5" step="0.5" value="0">
                <output id="smoothingVal" for="smoothing">0</output>
              </div>
            </div>

            <h2>Dithering</h2>

            <div class="control-row">
              <label for="ditherType">Mode</label>
              <select id="ditherType">
                <option value="None" selected>No extra texture</option>
                <option value="FloydSteinberg">Smooth transition (Floyd-Steinberg)</option>
                <option value="Ordered">Patterned look (ordered)</option>
                <option value="Noise">Grainy texture (noise)</option>
              </select>
            </div>

            <h2>Appearance</h2>

            <div class="control-row">
              <label for="dotShape">Dot shape</label>
              <select id="dotShape">
                <option value="circle" selected>Circle</option>
                <option value="square">Square</option>
                <option value="diamond">Diamond</option>
                <option value="triangle">Triangle</option>
                <option value="hexagon">Hexagon</option>
                <option value="cross">Cross</option>
                <option value="horizontal">Horizontal line</option>
                <option value="vertical">Vertical line</option>
              </select>
            </div>

            <div class="color-grid">
              <div class="control-row">
                <label for="dotColor">Dot color</label>
                <input id="dotColor" type="color" value="#111111">
              </div>
              <div class="control-row">
                <label for="backgroundColor">Background</label>
                <input id="backgroundColor" type="color" value="#ffffff">
              </div>
            </div>

            <div class="control-row">
              <label for="dotOpacity">Dot opacity</label>
              <div class="range-row">
                <input id="dotOpacity" type="range" min="10" max="100" value="100">
                <output id="dotOpacityVal" for="dotOpacity">100</output>
              </div>
            </div>

            <div class="control-row">
              <label for="dotScale">Dot scale</label>
              <div class="range-row">
                <input id="dotScale" type="range" min="50" max="140" value="100">
                <output id="dotScaleVal" for="dotScale">100</output>
              </div>
            </div>

            <div class="control-row">
              <label for="dotAngle">Dot angle</label>
              <div class="range-row">
                <input id="dotAngle" type="range" min="-90" max="90" value="0">
                <output id="dotAngleVal" for="dotAngle">0</output>
              </div>
            </div>

            <div class="control-row">
              <label for="dotJitter">Dot jitter</label>
              <div class="range-row">
                <input id="dotJitter" type="range" min="0" max="50" value="0">
                <output id="dotJitterVal" for="dotJitter">0</output>
              </div>
            </div>

            <label class="check-row" for="invertOutput">
              <input id="invertOutput" type="checkbox">
              <span>Invert</span>
            </label>

            <label class="check-row" for="transparentBackground">
              <input id="transparentBackground" type="checkbox">
              <span>Transparent background</span>
            </label>
          </section>

          <section class="panel actions-panel">
            <button id="resetButton" class="button" type="button">Reset</button>
          </section>
        </aside>

        <section class="preview-panel" aria-label="Halftone preview">
          <div class="preview-toolbar">
            <div class="segmented" role="group" aria-label="Preview mode">
              <button class="is-active" type="button" data-preview-mode="halftone" aria-pressed="true">Halftone</button>
              <button type="button" data-preview-mode="original" aria-pressed="false">Original</button>
            </div>
            <label class="compact-control" for="zoomMode">
              <span>Zoom</span>
              <select id="zoomMode">
                <option value="fit" selected>Fit</option>
                <option value="1">100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
            </label>
          </div>
          <div id="canvasViewport" class="canvas-viewport">
            <canvas id="halftoneCanvas" width="800" height="600"></canvas>
            <div id="previewState" class="preview-state" hidden></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./src/js/config.js"></script>
    <script src="./src/js/samples.js"></script>
    <script src="./src/js/sample-assets.js"></script>
    <script src="./src/js/motion-samples.js"></script>
    <script src="./src/js/theme.js"></script>
    <script src="./src/js/dom.js"></script>
    <script src="./src/js/presets.js"></script>
    <script src="./src/js/preset-controls.js"></script>
    <script src="./src/js/shapes.js"></script>
    <script src="./src/js/halftone.js"></script>
    <script src="./src/js/media.js"></script>
    <script src="./src/js/app.js"></script>
  </body>
</html>
